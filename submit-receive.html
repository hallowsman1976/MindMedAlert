<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <title>บันทึกการรับยา - ฟอร์มภายนอก</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/material_blue.css">
  <style>
    :root{
      --bg:#FBFBFD; --surface:#FFFFFF; --text:#1D1D1F; --text-2:#6E6E73;
      --separator:rgba(60,60,67,0.10); --separator-strong:rgba(60,60,67,0.18);
      --accent:#0071E3; --danger:#FF3B30; --success:#34C759;
    }
    @media (prefers-color-scheme: dark){
      :root{ --bg:#000000; --surface:#1C1C1E; --text:#F5F5F7; --text-2:#98989D;
        --separator:rgba(255,255,255,0.12); --separator-strong:rgba(255,255,255,0.2); }
    }
    *{ box-sizing:border-box; }
    body{ margin:0; font-family:'Noto Sans Thai','Prompt',sans-serif; background:var(--bg); color:var(--text); padding:20px; }
    .card{ max-width:480px; margin:0 auto; background:var(--surface); border:1px solid var(--separator); border-radius:20px; padding:28px 24px; box-shadow:0 8px 30px rgba(0,0,0,0.06); }
    h1{ font-size:18px; margin:0 0 18px; display:flex; align-items:center; gap:8px; }
    label{ display:block; font-size:13px; font-weight:600; margin:14px 0 6px; }
    input, select{ width:100%; padding:12px 13px; border-radius:10px; border:1px solid var(--separator-strong); font-size:15px; background:var(--bg); color:var(--text); font-family:inherit; }
    select[multiple]{ min-height:90px; }
    .hint{ font-size:12px; color:var(--text-2); margin-top:4px; }
    .patient-preview{ margin-top:8px; font-size:13.5px; padding:10px 12px; border-radius:10px; background:rgba(0,113,227,0.08); color:var(--accent); display:none; }
    .patient-preview.show{ display:block; }
    .patient-preview.err{ background:rgba(255,59,48,0.08); color:var(--danger); }
    button{ width:100%; margin-top:20px; padding:14px; border-radius:12px; border:none; background:var(--accent); color:#fff; font-size:15px; font-weight:600; cursor:pointer; font-family:inherit; }
    button:disabled{ opacity:0.6; cursor:not-allowed; }
    .msg{ margin-top:14px; font-size:13.5px; padding:10px 12px; border-radius:10px; display:none; }
    .msg.show{ display:block; }
    .msg.ok{ background:rgba(52,199,89,0.1); color:var(--success); }
    .msg.err{ background:rgba(255,59,48,0.1); color:var(--danger); }
  </style>
</head>
<body>
<div class="card">
  <h1><i class="bi bi-capsule-pill"></i> บันทึกการรับยา (ฟอร์มภายนอก)</h1>

  <label>HN คนไข้</label>
  <select id="f_hn">
    <option value="">-- กำลังโหลดรายชื่อคนไข้... --</option>
  </select>
  <div class="patient-preview" id="patientPreview"></div>

  <label>วันที่รับยา</label>
  <input id="f_date" type="text" placeholder="เลือกวันที่">

  <label>วันนัดครั้งถัดไป</label>
  <input id="f_appointment" type="text" placeholder="เลือกวันที่">

  <label>ยารับประทาน (เลือกได้หลายรายการ กด Ctrl/Cmd ค้างเพื่อเลือกหลายอัน)</label>
  <select id="f_oral" multiple></select>

  <label>ยาฉีด</label>
  <select id="f_injected" multiple></select>

  <button id="submitBtn" onclick="submitForm()"><i class="bi bi-send"></i> ส่งข้อมูล</button>
  <div class="msg" id="msgBox"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://npmcdn.com/flatpickr/dist/l10n/th.js"></script>
<script>
/* =========================================================================
 * ตั้งค่า 2 ค่านี้ให้ตรงกับของจริง (ดูได้จากหน้า Admin > ตั้งค่า):
 * - GAS_API_URL: ส่วน .../exec ของ Apps Script Web App URL
 * - FORM_KEY: ค่าที่ระบบสร้างให้อัตโนมัติ (ไม่ใช่รหัสลับจริง แค่กันบอท/สุ่มยิง)
 * ========================================================================= */
var GAS_API_URL = 'https://script.google.com/macros/s/AKfycbz7cm6jgBUWO1ZIRr9F-02x-wEzfBewRurOag32KrVLRZkShaOLQYb0LDCrtJGr41Vj/exec';
var FORM_KEY = '20be2a27186248b7b6399be528907a21';

var patientList = [];

function apiGet(action, params){
  var url = new URL(GAS_API_URL);
  url.searchParams.set('action', action);
  Object.keys(params||{}).forEach(function(k){ url.searchParams.set(k, params[k]); });
  return fetch(url.toString()).then(function(r){ return r.json(); });
}
function apiPost(action, data){
  var payload = Object.assign({ action: action }, data);
  return fetch(GAS_API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  }).then(function(r){ return r.json(); });
}

function loadDrugs(){
  apiGet('getDrugListGateway', { formKey: FORM_KEY }).then(function(res){
    if(!res.success){ showMsg(false, res.message); return; }
    fillSelect('f_oral', res.data.oral);
    fillSelect('f_injected', res.data.injected);
  });
}
function fillSelect(id, items){
  var el = document.getElementById(id);
  el.innerHTML = (items||[]).map(function(v){ return '<option value="'+escapeHtml(v)+'">'+escapeHtml(v)+'</option>'; }).join('');
}
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
  });
}

function loadPatients(){
  apiGet('getPatientListGateway', { formKey: FORM_KEY }).then(function(res){
    var sel = document.getElementById('f_hn');
    if(!res.success){
      sel.innerHTML = '<option value="">-- โหลดรายชื่อไม่สำเร็จ --</option>';
      showMsg(false, res.message);
      return;
    }
    patientList = res.data || [];
    sel.innerHTML = '<option value="">-- เลือก HN คนไข้ --</option>' +
      patientList.map(function(p){ return '<option value="'+escapeHtml(p.hn)+'">'+escapeHtml(p.hn)+' - '+escapeHtml(p.name)+'</option>'; }).join('');
  });
}

document.getElementById('f_hn').addEventListener('change', function(){
  var hn = this.value;
  var box = document.getElementById('patientPreview');
  if(!hn){ box.className = 'patient-preview'; return; }
  var p = patientList.find(function(x){ return x.hn === hn; });
  if(p){
    box.textContent = '✓ ' + p.name;
    box.className = 'patient-preview show';
  } else {
    box.className = 'patient-preview';
  }
});

function showMsg(ok, text){
  var box = document.getElementById('msgBox');
  box.textContent = text;
  box.className = 'msg show ' + (ok ? 'ok' : 'err');
}

/* =========================================================================
 * Flatpickr แบบแสดงปี พ.ศ. (เก็บค่าจริงเป็น ค.ศ. ISO ส่งไป backend เหมือนเดิม)
 * โค้ดชุดนี้เหมือนกับที่ใช้ในหน้า Admin (createThaiDatePicker)
 * ========================================================================= */
var TH_MONTHS_SHORT = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
function formatThaiBE(date){
  if(!date) return '';
  return date.getDate() + ' ' + TH_MONTHS_SHORT[date.getMonth()] + ' ' + (date.getFullYear()+543);
}
function updateYearToBE_(instance){
  try {
    var ceYear = instance.currentYear;
    var beYear = ceYear + 543;
    var yearInput = instance.calendarContainer.querySelector('.cur-year');
    if(yearInput && yearInput.tagName === 'INPUT'){
      yearInput.value = beYear;
      if(!yearInput._beBound){
        yearInput._beBound = true;
        yearInput.addEventListener('input', function(e){
          var v = parseInt(this.value, 10);
          if(!isNaN(v) && v > 2400){
            instance.changeYear(v - 543);
            setTimeout(function(){ yearInput.value = v; }, 0);
          }
        });
      }
    }
    var yearSelect = instance.calendarContainer.querySelector('select.flatpickr-yearDropdown-years');
    if(yearSelect){
      Array.from(yearSelect.options).forEach(function(opt){
        var v = parseInt(opt.value, 10);
        if(!isNaN(v) && v < 2400) opt.textContent = (v + 543);
      });
    }
  } catch(e) { /* silent */ }
}
function createThaiDatePicker(selector, opts){
  opts = opts || {};
  var el = (typeof selector === 'string') ? document.querySelector(selector) : selector;
  if(!el) return null;
  if(el._flatpickr) el._flatpickr.destroy();
  var config = {
    locale: 'th',
    dateFormat: 'Y-m-d',
    altInput: true,
    altFormat: 'j M Y',
    allowInput: false,
    disableMobile: true,
    monthSelectorType: 'dropdown',
    formatDate: function(date, format){
      if(format === 'j M Y') return formatThaiBE(date);
      if(format === 'Y-m-d'){
        var y = date.getFullYear();
        var m = String(date.getMonth()+1).padStart(2,'0');
        var d = String(date.getDate()).padStart(2,'0');
        return y+'-'+m+'-'+d;
      }
      return date.toString();
    },
    onReady: function(selectedDates, dateStr, instance){ updateYearToBE_(instance); },
    onMonthChange: function(selectedDates, dateStr, instance){ updateYearToBE_(instance); },
    onYearChange: function(selectedDates, dateStr, instance){ updateYearToBE_(instance); },
    onOpen: function(selectedDates, dateStr, instance){ updateYearToBE_(instance); }
  };
  if(opts.minDate) config.minDate = opts.minDate;
  if(opts.maxDate) config.maxDate = opts.maxDate;
  if(opts.defaultDate) config.defaultDate = opts.defaultDate;
  return flatpickr(el, config);
}

var fpDate = createThaiDatePicker('#f_date', { defaultDate: 'today', maxDate: 'today' });
var fpAppointment = createThaiDatePicker('#f_appointment', { minDate: 'today' });

function submitForm(){
  var hn = document.getElementById('f_hn').value;
  var date = document.getElementById('f_date').value;
  var appointment = document.getElementById('f_appointment').value;
  var oral = Array.from(document.getElementById('f_oral').selectedOptions).map(function(o){ return o.value; });
  var injected = Array.from(document.getElementById('f_injected').selectedOptions).map(function(o){ return o.value; });

  if(!hn) return showMsg(false, 'กรุณาเลือก HN');
  if(!date) return showMsg(false, 'กรุณาระบุวันที่รับยา');
  if(!appointment) return showMsg(false, 'กรุณาระบุวันนัด');

  var btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.innerHTML = '<i class="bi bi-hourglass-split"></i> กำลังส่ง...';

  apiPost('submitReceiveGateway', {
    formKey: FORM_KEY, hn: hn, date: date, appointment: appointment,
    drugOral: oral, drugInjected: injected
  }).then(function(res){
    btn.disabled = false;
    btn.innerHTML = '<i class="bi bi-send"></i> ส่งข้อมูล';
    showMsg(res.success, res.message);
    if(res.success){
      document.getElementById('f_hn').value = '';
      document.getElementById('patientPreview').className = 'patient-preview';
      if(fpDate) fpDate.setDate('today', true);
      if(fpAppointment) fpAppointment.clear();
    }
  }).catch(function(err){
    btn.disabled = false;
    btn.innerHTML = '<i class="bi bi-send"></i> ส่งข้อมูล';
    showMsg(false, (err && err.message) || 'เกิดข้อผิดพลาด');
  });
}

loadDrugs();
loadPatients();
</script>
</body>
</html>
